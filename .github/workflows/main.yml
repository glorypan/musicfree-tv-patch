name: Build Bundle
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MusicFree v0.6.0
        uses: actions/checkout@v4
        with:
          repository: maotoumao/MusicFree
          ref: v0.6.0
          path: musicfree-src

      - name: Checkout our patch
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Copy patch files
        run: cp -r patches/src/* musicfree-src/src/

      - name: Install dependencies
        working-directory: musicfree-src
        run: npm install

      - name: Bundle android js
        working-directory: musicfree-src
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output index.bundle --assets-dest dist

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: index-bundle
          path: musicfree-src/index.bundle
